name: Release package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Package IL2CPP release
    runs-on: windows-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Create release package
        shell: pwsh
        run: .\package.ps1 -DllPath .\packages\mods\ThriftyThreadsExpanded_Il2cpp.dll

      - name: Upload release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" .\packages\ThriftyThreadsExpanded.zip --clobber
